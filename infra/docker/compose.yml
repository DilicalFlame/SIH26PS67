# All variables here come from the root .env (see .env.example) — invoke as
# `docker compose --env-file .env -f infra/docker/compose.yml up -d` from the
# repo root, or Compose won't find it: it looks for .env next to *this*
# file's own directory by default, not the caller's cwd.
services:

  postgres:
    image: postgis/postgis:latest
    container_name: thalassa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thalassa}
      POSTGRES_USER: ${POSTGRES_USER:-thalassa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env at the repo root}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thalassa} -d ${POSTGRES_DB:-thalassa}"]
      interval: 5s
      timeout: 5s
      retries: 10


  minio:
    image: minio/minio:latest
    container_name: thalassa-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-thalassa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required — copy .env.example to .env at the repo root}
      # Server-wide CORS so the browser can issue the many small Range
      # requests PMTiles relies on directly against MinIO (per-bucket CORS
      # XML via `mc cors set` isn't reliably supported by this MinIO build).
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10


  # One-shot init: creates the "tiles" bucket and makes it public-read (tile
  # bytes are non-sensitive open geo data) so the browser can fetch PMTiles
  # byte ranges directly from MinIO — see docs/architecture/Thalassa
  # Architecture.webp, which draws SvelteKit -> MinIO as a direct arrow (no
  # API proxy in the middle). CORS is handled server-wide via
  # MINIO_API_CORS_ALLOW_ORIGIN on the minio service above.
  minio-init:
    image: minio/mc:latest
    container_name: thalassa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-thalassa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required — copy .env.example to .env at the repo root}
      MINIO_BUCKET: ${MINIO_BUCKET:-tiles}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$$MINIO_BUCKET\" &&
      mc anonymous set download local/\"$$MINIO_BUCKET\"
      "


  # Dev-only container: reload bind-mount, see apps/api/Dockerfile.dev. The
  # host-side .env's POSTGRES_HOST/MINIO_ENDPOINT default to localhost (for
  # running the API on the host instead, per CONTRIBUTING.md); inside the
  # compose network those must be the service names instead, so this
  # overrides just those two plus the DATABASE_URL built from them.
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.dev
    container_name: thalassa-api
    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-thalassa}
      POSTGRES_USER: ${POSTGRES_USER:-thalassa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env at the repo root}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-thalassa}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env at the repo root}@postgres:5432/${POSTGRES_DB:-thalassa}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-thalassa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required — copy .env.example to .env at the repo root}
      MINIO_BUCKET: ${MINIO_BUCKET:-tiles}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}

    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"

    volumes:
      - ../../apps/api:/app

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy


volumes:
  postgres_data:
  minio_data:
