services:

  postgres:
    image: postgis/postgis:latest
    container_name: thalassa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: thalassa
      POSTGRES_USER: thalassa
      POSTGRES_PASSWORD: admin@123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  minio:
    image: minio/minio:latest
    container_name: thalassa-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: thalassa
      MINIO_ROOT_PASSWORD: admin@123
      # Server-wide CORS so the browser can issue the many small Range
      # requests PMTiles relies on directly against MinIO (per-bucket CORS
      # XML via `mc cors set` isn't reliably supported by this MinIO build).
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10


  # One-shot init: creates the "tiles" bucket and makes it public-read (tile
  # bytes are non-sensitive open geo data) so the browser can fetch PMTiles
  # byte ranges directly from MinIO — see docs/architecture/Thalassa
  # Architecture.webp, which draws SvelteKit -> MinIO as a direct arrow (no
  # API proxy in the middle). CORS is handled server-wide via
  # MINIO_API_CORS_ALLOW_ORIGIN on the minio service above.
  minio-init:
    image: minio/mc:latest
    container_name: thalassa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: thalassa
      MINIO_ROOT_PASSWORD: admin@123
      MINIO_BUCKET: tiles
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$$MINIO_BUCKET\" &&
      mc anonymous set download local/\"$$MINIO_BUCKET\"
      "


volumes:
  postgres_data:
  minio_data: